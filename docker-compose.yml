services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: bible
      POSTGRES_DB: bible
    ports:
      - "5433:5432"
    volumes:
      - bible_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d bible"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  bible_pgdata:
